{% extends "base.html" %}

{% block main_content %}
{% spaceless %}

<div class="row">
  {% for p in objs %}
    <div class="col-md-4 d-flex align-items-stretch">
      <div class="card mb-4 shadow-sm w-100">
        <div class="bg-light d-flex justify-content-center align-items-center" 
             style="height: 250px; overflow: hidden;">
          <img src="{{ p.picture.url }}" class="card-img-top" alt="{{ p.name }}"
               style="height: 100%; width: 100%; object-fit: contain; object-position: center;">
        </div>
        <div class="card-body d-flex flex-column">
          <p class="card-text mb-3">
            <b>{{ p.name }}</b><br>
            {{ p.description }}
          </p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <div class="btn-group">
              <button type="button" class="btn btn-sm btn-outline-secondary">View</button>
              <button type="button" class="btn btn-sm btn-outline-secondary">Add To Card</button>
            </div>
            <small class="text-muted">{{ p.price }} Tomans</small>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>

{% endspaceless %}
{% endblock main_content %}
